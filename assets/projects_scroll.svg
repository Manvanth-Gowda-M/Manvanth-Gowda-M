<svg width="800" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="250" fill="#000000" />
  
  <g>
    <!-- Card 1 -->
    <g transform="translate(20, 25)">
      <rect width="300" height="180" fill="#000" stroke="#FF5F1F" stroke-width="5" />
      <text x="15" y="40" fill="#FF5F1F" font-family="sans-serif" font-weight="bold" font-size="22">GIT-PROOF</text>
      <rect x="15" y="55" width="270" height="3" fill="#FF5F1F" />
      <text x="15" y="85" fill="#FFF" font-family="monospace" font-size="14">Secure certification platform.</text>
      <text x="15" y="105" fill="#FFF" font-family="monospace" font-size="14">Identity governance system.</text>
      <rect x="200" y="145" width="85" height="25" fill="#FF5F1F" />
      <text x="210" y="163" fill="#000" font-family="sans-serif" font-weight="bold" font-size="12">STABLE</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(360, 25)">
      <rect width="300" height="180" fill="#000" stroke="#FF5F1F" stroke-width="5" />
      <text x="15" y="40" fill="#FF5F1F" font-family="sans-serif" font-weight="bold" font-size="22">MOTION-X</text>
      <rect x="15" y="55" width="270" height="3" fill="#FF5F1F" />
      <text x="15" y="85" fill="#FFF" font-family="monospace" font-size="14">Remotion video framework.</text>
      <text x="15" y="105" fill="#FFF" font-family="monospace" font-size="14">Programmatic rendering.</text>
      <rect x="200" y="145" width="85" height="25" fill="#FF5F1F" />
      <text x="210" y="163" fill="#000" font-family="sans-serif" font-weight="bold" font-size="12">CORE</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(700, 25)">
      <rect width="300" height="180" fill="#000" stroke="#FF5F1F" stroke-width="5" />
      <text x="15" y="40" fill="#FF5F1F" font-family="sans-serif" font-weight="bold" font-size="22">NEXUSDB</text>
      <rect x="15" y="55" width="270" height="3" fill="#FF5F1F" />
      <text x="15" y="85" fill="#FFF" font-family="monospace" font-size="14">High-perf JSON engine.</text>
      <text x="15" y="105" fill="#FFF" font-family="monospace" font-size="14">ACID transaction support.</text>
      <rect x="200" y="145" width="85" height="25" fill="#FF5F1F" />
      <text x="210" y="163" fill="#000" font-family="sans-serif" font-weight="bold" font-size="12">STORAGE</text>
    </g>

    <!-- Loop -->
    <g transform="translate(1040, 25)">
      <rect width="300" height="180" fill="#000" stroke="#FF5F1F" stroke-width="5" />
      <text x="15" y="40" fill="#FF5F1F" font-family="sans-serif" font-weight="bold" font-size="22">GIT-PROOF</text>
      <rect x="15" y="55" width="270" height="3" fill="#FF5F1F" />
      <text x="15" y="85" fill="#FFF" font-family="monospace" font-size="14">Secure certification platform.</text>
      <rect x="200" y="145" width="85" height="25" fill="#FF5F1F" />
      <text x="210" y="163" fill="#000" font-family="sans-serif" font-weight="bold" font-size="12">STABLE</text>
    </g>

    <animateTransform 
      attributeName="transform" 
      type="translate" 
      from="0 0" 
      to="-1020 0" 
      dur="15s" 
      repeatCount="indefinite" />
  </g>

  <rect width="800" height="250" stroke="#FF5F1F" stroke-width="10" fill="none" />
</svg>
