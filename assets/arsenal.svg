<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#000000" />
  
  <!-- Frame Counter (Marvel Style) -->
  <g>
    <rect x="0" y="0" width="800" height="400" fill="#FF5F1F">
      <animate attributeName="opacity" values="1;0;1;0;1;0;0" dur="1.5s" fill="freeze" />
    </rect>
    <text x="400" y="200" dominant-baseline="middle" text-anchor="middle" fill="#000" font-family="Arial Black" font-size="100" font-weight="900">
      TECH
      <animate attributeName="opacity" values="1;0;1;0;1;0;0" dur="1.5s" fill="freeze" />
    </text>
  </g>

  <!-- Content Reveal -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze" />
    
    <!-- Grid -->
    <path d="M0 50H800M0 150H800M0 250H800M0 350H800M100 0V400M300 0V400M500 0V400M700 0V400" stroke="#FF5F1F" stroke-width="1" stroke-opacity="0.2" />

    <!-- Title -->
    <text x="40" y="60" fill="#FF5F1F" font-family="Arial Black" font-size="30" font-weight="900">ARSENAL_LOADED.EXE</text>
    
    <!-- Tech Cards -->
    <!-- Row 1 -->
    <rect x="40" y="100" width="220" height="120" stroke="#FF5F1F" stroke-width="4" fill="#000" />
    <text x="150" y="160" dominant-baseline="middle" text-anchor="middle" fill="#FF5F1F" font-family="Arial Black" font-size="20">REACT/NEXT</text>
    
    <rect x="290" y="100" width="220" height="120" stroke="#FF5F1F" stroke-width="4" fill="#000" />
    <text x="400" y="160" dominant-baseline="middle" text-anchor="middle" fill="#FF5F1F" font-family="Arial Black" font-size="20">TYPESCRIPT</text>
    
    <rect x="540" y="100" width="220" height="120" stroke="#FF5F1F" stroke-width="4" fill="#000" />
    <text x="650" y="160" dominant-baseline="middle" text-anchor="middle" fill="#FF5F1F" font-family="Arial Black" font-size="20">NODE/EXPRESS</text>

    <!-- Row 2 -->
    <rect x="40" y="240" width="220" height="120" stroke="#FF5F1F" stroke-width="4" fill="#000" />
    <text x="150" y="300" dominant-baseline="middle" text-anchor="middle" fill="#FF5F1F" font-family="Arial Black" font-size="20">POSTGRES</text>
    
    <rect x="290" y="240" width="220" height="120" stroke="#FF5F1F" stroke-width="4" fill="#000" />
    <text x="400" y="300" dominant-baseline="middle" text-anchor="middle" fill="#FF5F1F" font-family="Arial Black" font-size="20">DOCKER/AWS</text>
    
    <rect x="540" y="240" width="220" height="120" stroke="#FF5F1F" stroke-width="4" fill="#000" />
    <text x="650" y="300" dominant-baseline="middle" text-anchor="middle" fill="#FF5F1F" font-family="Arial Black" font-size="20">PYTHON/ML</text>
  </g>

  <!-- Border -->
  <rect width="800" height="400" stroke="#FF5F1F" stroke-width="10" fill="none" />
</svg>
