<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes flash {
      0%, 100% { opacity: 0; }
      1%, 14% { opacity: 1; }
      15% { opacity: 0; }
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes glitch {
      0% { clip-path: inset(10% 0 30% 0); transform: translate(-5px, 2px); }
      20% { clip-path: inset(40% 0 10% 0); transform: translate(5px, -2px); }
      40% { clip-path: inset(70% 0 5% 0); transform: translate(-3px, 1px); }
      60% { clip-path: inset(20% 0 50% 0); transform: translate(3px, -1px); }
      80% { clip-path: inset(50% 0 20% 0); transform: translate(-2px, 2px); }
      100% { clip-path: inset(10% 0 30% 0); transform: translate(2px, -2px); }
    }
    .intro-text { font-family: 'Arial Black', sans-serif; font-weight: 900; font-size: 100px; text-anchor: middle; dominant-baseline: middle; fill: #FF5F1F; }
    .intro-bg { fill: #000; }
    .reveal { animation: slideIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) 1.2s forwards; opacity: 0; }
    .tech-label { font-family: 'Arial Black', sans-serif; font-size: 14px; fill: #FF5F1F; letter-spacing: 2px; }
    .tech-value { font-family: 'Courier New', monospace; font-size: 18px; fill: #FFFFFF; font-weight: bold; }
    .glitch-effect { animation: glitch 0.2s infinite; opacity: 0.3; }
  </style>

  <!-- BACKGROUND -->
  <rect width="800" height="400" fill="#000000" />

  <!-- MARVEL STYLE INTRO (RAPID FIRE) -->
  <g id="intro">
    <g style="animation: flash 1.2s step-end 0s forwards;">
      <rect width="800" height="400" fill="#FF5F1F" />
      <text x="400" y="200" class="intro-text" fill="#000">ARCHITECT</text>
    </g>
    <g style="animation: flash 1.2s step-end 0.1s forwards; opacity: 0;">
      <rect width="800" height="400" fill="#000" />
      <text x="400" y="200" class="intro-text">ENGINEER</text>
    </g>
    <g style="animation: flash 1.2s step-end 0.2s forwards; opacity: 0;">
      <rect width="800" height="400" fill="#FF5F1F" />
      <text x="400" y="200" class="intro-text" fill="#000">INNOVATE</text>
    </g>
    <g style="animation: flash 1.2s step-end 0.3s forwards; opacity: 0;">
      <rect width="800" height="400" fill="#000" />
      <text x="400" y="200" class="intro-text">DEPLOY</text>
    </g>
    <g style="animation: flash 1.2s step-end 0.4s forwards; opacity: 0;">
      <rect width="800" height="400" fill="#FF5F1F" />
      <text x="400" y="200" class="intro-text" fill="#000">SCALE</text>
    </g>
    <g style="animation: flash 1.2s step-end 0.5s forwards; opacity: 0;">
      <rect width="800" height="400" fill="#000" />
      <text x="400" y="200" class="intro-text">OPTIMIZE</text>
    </g>
    <g style="animation: flash 1.2s step-end 0.6s forwards; opacity: 0;">
      <rect width="800" height="400" fill="#FF5F1F" />
      <text x="400" y="200" class="intro-text" fill="#000">TECH</text>
    </g>
    <g style="animation: flash 1.2s step-end 0.7s forwards; opacity: 0;">
      <rect width="800" height="400" fill="#000" />
      <text x="400" y="200" class="intro-text" font-size="120">ARSENAL</text>
    </g>
  </g>

  <!-- FINAL REVEAL: NEO-BRUTALIST DASHBOARD -->
  <g class="reveal">
    <!-- Grid System -->
    <path d="M0 100H800M0 200H800M0 300H800M200 0V400M400 0V400M600 0V400" stroke="#FF5F1F" stroke-width="1" opacity="0.2" />
    
    <!-- Header -->
    <rect x="20" y="20" width="760" height="60" fill="#FF5F1F" />
    <text x="40" y="62" fill="#000" font-family="Arial Black" font-size="30" font-weight="900">SYSTEM_ARSENAL_V2.0</text>
    <text x="760" y="62" text-anchor="end" fill="#000" font-family="Courier New" font-size="14" font-weight="bold">AUTH_ENCRYPTED: TRUE</text>

    <!-- Tech Segments -->
    <g transform="translate(40, 120)">
      <!-- Frontend -->
      <text x="0" y="0" class="tech-label">CORE.FRONTEND</text>
      <text x="0" y="30" class="tech-value">React / Next.js / TypeScript</text>
      <rect x="0" y="45" width="300" height="8" fill="#333" />
      <rect x="0" y="45" width="280" height="8" fill="#FF5F1F" />

      <!-- Backend -->
      <text x="380" y="0" class="tech-label">CORE.BACKEND</text>
      <text x="380" y="30" class="tech-value">Node.js / Python / Go</text>
      <rect x="380" y="45" width="300" height="8" fill="#333" />
      <rect x="380" y="45" width="260" height="8" fill="#FF5F1F" />

      <!-- Data -->
      <text x="0" y="100" class="tech-label">CORE.DATA_SYSTEMS</text>
      <text x="0" y="130" class="tech-value">Postgres / MongoDB / Redis</text>
      <rect x="0" y="145" width="300" height="8" fill="#333" />
      <rect x="0" y="145" width="240" height="8" fill="#FF5F1F" />

      <!-- AI -->
      <text x="380" y="100" class="tech-label">CORE.AI_INFRA</text>
      <text x="380" y="130" class="tech-value">PyTorch / OpenAI / LangChain</text>
      <rect x="380" y="145" width="300" height="8" fill="#333" />
      <rect x="380" y="145" width="290" height="8" fill="#FF5F1F" />

      <!-- Devops -->
      <text x="0" y="200" class="tech-label">CORE.DEVOPS</text>
      <text x="0" y="230" class="tech-value">Docker / AWS / Kubernetes</text>
      <rect x="0" y="245" width="300" height="8" fill="#333" />
      <rect x="0" y="245" width="220" height="8" fill="#FF5F1F" />

      <!-- Innovation -->
      <text x="380" y="200" class="tech-label">CORE.INNOVATION</text>
      <text x="380" y="230" class="tech-value">WebAssembly / WebGL / XR</text>
      <rect x="380" y="245" width="300" height="8" fill="#333" />
      <rect x="380" y="245" width="270" height="8" fill="#FF5F1F" />
    </g>

    <!-- Scanline -->
    <rect x="0" y="0" width="800" height="4" fill="#FF5F1F" opacity="0.3">
      <animate attributeName="y" from="0" to="400" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Border -->
  <rect x="5" y="5" width="790" height="390" stroke="#FF5F1F" stroke-width="10" fill="none" />
</svg>
