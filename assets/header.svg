<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="200" fill="#000000" />
  
  <!-- Jitter Text Group -->
  <g>
    <text x="400" y="100" dominant-baseline="middle" text-anchor="middle" fill="#FF5F1F" font-family="Arial Black, Gadget, sans-serif" font-weight="900" font-size="60">
      MANVANTH GOWDA M
      <animateTransform attributeName="transform" type="translate" values="0,0; -3,2; 3,-2; -2,-3; 0,0" dur="0.2s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Scanline -->
  <rect width="800" height="10" fill="#FF5F1F" fill-opacity="0.1">
    <animate attributeName="y" from="-10" to="200" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Status Bar -->
  <text x="400" y="140" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="18">
    // SYSTEM STATUS: <tspan fill="#FF5F1F">OPTIMIZED</tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </text>

  <!-- Window Controls -->
  <rect x="700" y="20" width="80" height="25" fill="#FF5F1F" />
  <text x="710" y="38" fill="#000" font-family="monospace" font-weight="bold" font-size="14">_ [] X</text>

  <!-- Border -->
  <rect width="800" height="200" stroke="#FF5F1F" stroke-width="10" fill="none" />
</svg>
