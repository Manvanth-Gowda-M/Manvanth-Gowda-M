<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #000000; }
    .border { stroke: #FF5F1F; stroke-width: 10; }
    .text { 
      font-family: 'Arial Black', Gadget, sans-serif; 
      font-weight: 900; 
      font-size: 60px; 
      fill: #FF5F1F;
      text-transform: uppercase;
    }
    
    .glitch {
      animation: glitch 1.5s infinite;
    }
    
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(-3px, -2px); }
      60% { transform: translate(3px, 2px); }
      80% { transform: translate(3px, -2px); }
      100% { transform: translate(0); }
    }
    
    .scanline {
      fill: rgba(255, 95, 31, 0.1);
      animation: scan 4s linear infinite;
    }
    
    @keyframes scan {
      0% { transform: translateY(-200px); }
      100% { transform: translateY(200px); }
    }
    
    .status-ticker {
      font-family: monospace;
      font-size: 14px;
      fill: #FF5F1F;
      animation: ticker 20s linear infinite;
    }
    
    @keyframes ticker {
      0% { transform: translateX(800px); }
      100% { transform: translateX(-1000px); }
    }

    .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="200" class="bg" />
  
  <!-- Content -->
  <g class="glitch">
    <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" class="text">MANVANTH GOWDA M</text>
  </g>
  
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="18">
    // SYSTEM STATUS: <tspan fill="#FF5F1F" class="blink">OPTIMIZED</tspan>
  </text>

  <!-- Scanline -->
  <rect width="800" height="10" class="scanline" />

  <!-- Window Controls -->
  <rect x="730" y="20" width="15" height="15" fill="#FF5F1F" />
  <rect x="755" y="20" width="15" height="15" fill="#FF5F1F" />
  <rect x="705" y="20" width="15" height="15" fill="#FF5F1F" />
  <text x="732" y="32" fill="#000" font-family="monospace" font-weight="bold" font-size="12">[]</text>
  <text x="758" y="32" fill="#000" font-family="monospace" font-weight="bold" font-size="12">X</text>
  <text x="709" y="30" fill="#000" font-family="monospace" font-weight="bold" font-size="12">_</text>

  <!-- Bottom Ticker -->
  <text y="190" class="status-ticker">
    AGI INITIALIZED ... QUANTUM PROTOCOLS ENGAGED ... MCP GOVERNANCE ACTIVE ... PERFORMANCE: PEAK ... NO COMPROMISE ... NEXTGENX ELITE ... 
  </text>

  <!-- Border -->
  <rect width="800" height="200" class="border" fill="none" />
</svg>
